<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>
    html,body,#map { margin:0; width:100%; height:100%; background:#f8fafc; overflow:hidden; }
    .point { box-sizing:border-box; width:28px; height:28px; border:4px solid white; border-radius:50%; background:#3086ff; box-shadow:0 1px 6px #0004; }
    .runner { width:44px; height:44px; border:2px solid white; border-radius:50%; background:#16836f; color:white; font:700 14px sans-serif; padding:0; }
    .runner.group { background:#6750a4; width:50px; height:50px; }
    .runner.selected { background:#202428; }
    .endpoint { box-sizing:border-box; display:flex; align-items:center; justify-content:center; width:32px; height:32px; background:white; color:#16836f; border:2px solid currentColor; border-radius:50%; box-shadow:0 1px 6px #0004; }
    .endpoint svg { width:20px; height:20px; }
    .endpoint.end { color:#c13647; }
    /* 코인으로 산 테두리: 색은 사용자가 고르고, 오라는 같은 색으로 맥동합니다. */
    .point.frame { position:relative; display:flex; align-items:center; justify-content:center; width:34px; height:34px; background:white; color:#334155; border:3px solid var(--c); }
    .point.frame svg { width:18px; height:18px; }
    .point.frame.aura { border-width:4px; animation:pulse 1.6s ease-in-out infinite alternate; }
    @keyframes pulse { from { box-shadow:0 0 8px 2px var(--g); } to { box-shadow:0 0 18px 8px var(--g); } }
    /* 다른 러너가 착용한 테두리도 같은 색과 오라로 보여줍니다. */
    .runner.framed { box-sizing:border-box; border:3px solid var(--c); }
    .runner.framed.aura { border-width:4px; animation:pulse 1.6s ease-in-out infinite alternate; }
    /* 함께 달리기 덩어리: 신청한 사람의 오라 색 동그라미 하나에 인원수만 적습니다. */
    .runner.group.framed { background:var(--c); border:3px solid white; font:800 18px sans-serif; }
    @media (prefers-reduced-motion:reduce) { .point.frame.aura, .runner.framed.aura { animation:none; box-shadow:0 0 14px 5px var(--g); } }
    /* 친구와 이어진 오라는 아래 캔버스가 대신 그리므로 개별 오라는 끕니다. */
    .fused { animation:none !important; box-shadow:none !important; }
    .aura-layer { display:block; pointer-events:none; }
  </style>
</head>
<body><div id="map"></div>
<script>
'use strict';
const emit = data => { if (window.RunSpotMap) window.RunSpotMap.postMessage(JSON.stringify(data)); };
window.mapLoadFailed = () => emit({type:'error'});

// 오라 합체(메타볼) 계산입니다. 한 점에서 오라의 세기와 섞인 색을 구합니다.
// 러너마다 둥근 세기장을 두고 더해, 가까워지면 물방울처럼 이어 붙습니다.
window.runspotAura = (() => {
  // peak은 가장 밝은 채널입니다. 섞인 색이 탁해지지 않게 밝기를 되살릴 때 씁니다.
  const rgb = hex => { const c = [1,3,5].map(i => parseInt(hex.slice(i,i+2),16)); c.peak = Math.max(c[0],c[1],c[2]) || 1; return c; };
  const kernel = q2 => q2 >= 1 ? 0 : (1-q2)*(1-q2)*(1-q2);
  const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x*x*(3-2*x);
  // shapes: 러너 {x,y,r,c} 또는 두 러너를 잇는 목 {link:true,ax,ay,bx,by,r,w,ca,cb}
  function sample(shapes, x, y, out) {
    let f = 0, r = 0, g = 0, b = 0, peak = 0;
    for (const s of shapes) {
      if (s.link) {
        const dx = s.bx-s.ax, dy = s.by-s.ay, len2 = dx*dx+dy*dy;
        let t = len2 ? ((x-s.ax)*dx+(y-s.ay)*dy)/len2 : 0;
        t = t < 0 ? 0 : t > 1 ? 1 : t;
        const px = s.ax+dx*t-x, py = s.ay+dy*t-y;
        const k = s.w*kernel((px*px+py*py)/(s.r*s.r));
        // 이어진 부분은 양쪽 색이 위치 비율대로 섞입니다(가운데는 반반).
        if (k) { f += k; r += k*(s.ca[0]+(s.cb[0]-s.ca[0])*t); g += k*(s.ca[1]+(s.cb[1]-s.ca[1])*t); b += k*(s.ca[2]+(s.cb[2]-s.ca[2])*t); peak += k*(s.ca.peak+(s.cb.peak-s.ca.peak)*t); }
      } else {
        const px = s.x-x, py = s.y-y, k = kernel((px*px+py*py)/(s.r*s.r));
        if (k) { f += k; r += k*s.c[0]; g += k*s.c[1]; b += k*s.c[2]; peak += k*s.c.peak; }
      }
    }
    out[0] = f;
    if (f) {
      // 빨강과 파랑을 그대로 평균 내면 어두운 회보라가 되므로, 원래 색들의 밝기만큼 되살립니다.
      const gain = peak/((Math.max(r,g,b) || 1)*f);
      out[1] = r*gain; out[2] = g*gain; out[3] = b*gain;
    }
    return out;
  }
  // 거리 기준은 앱이 보냅니다(합체·분리·빛줄기 시작 거리, m). 값이 없으면 기본값을 씁니다.
  const LIMITS = {merge: 300, split: 400, beam: 600};
  // 빛줄기 세기: 빛줄기가 시작되는 거리에서 0, 합체 거리에서 1입니다.
  const beam = (meters, l = LIMITS) => Math.max(0, Math.min(1, (l.beam-meters)/(l.beam-l.merge)));
  // 합쳐진 뒤 25m에서 40m로 멀어질수록 목이 가늘어집니다.
  const neck = (meters, l = LIMITS) => 1-.65*Math.max(0, Math.min(1, (meters-l.merge)/(l.split-l.merge)));
  return {rgb, kernel, smooth, sample, beam, neck, LIMITS};
})();
window.createRunspotMap = () => {
  if (!window.kakao || !kakao.maps) { window.mapLoadFailed(); return; }
  kakao.maps.load(() => {
    const container = document.getElementById('map');
    const map = new kakao.maps.Map(container, {center:new kakao.maps.LatLng(37.5665,126.978),level:5});
    map.setMinLevel(1); map.setMaxLevel(14);
    let revision = -1, geometry = '', own = null, ownElement = null;
    const runnerIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 19.4l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg>';
    const runners = new Map();
    let lines = [], ends = [];
    const point = xy => new kakao.maps.LatLng(xy[0],xy[1]);
    const level = zoom => Math.max(1,Math.min(14,Math.round(20-zoom)));
    function overlay(xy, element, zIndex) {
      return new kakao.maps.CustomOverlay({map,position:point(xy),content:element,xAnchor:.5,yAnchor:.5,zIndex});
    }
    // ── 친구와 합쳐지는 오라 ──
    // 합칠지 말지는 앱이 실제 거리(m)로 정해 보내고, 여기서는 받은 상태를 지도 위 캔버스에 그리기만 합니다.
    const aura = (() => {
      const M = window.runspotAura, BASE = 46;
      // 캔버스 크기(px)입니다. 이어진 친구가 멀리 있으면 모두 담기도록 늘립니다.
      let SIZE = 560, limits = M.LIMITS;
      const still = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const raf = typeof requestAnimationFrame === 'function' ? requestAnimationFrame : null;
      let canvas = null, ctx = null, layer = null, off = null, offCtx = null;
      let self = null, running = false, last = 0;
      const nodes = new Map(), links = new Map();
      let ghosts = [], effects = [];
      const out = [0,0,0,0];
      const key = (a,b) => a < b ? a+'|'+b : b+'|'+a;
      const where = id => id === 'self' ? self : nodes.get(id);
      const middle = (a,b) => [(a.lat+b.lat)/2, (a.lng+b.lng)/2];
      const phase = id => { let h = 0; for (const ch of id) h = (h*31+ch.charCodeAt(0)) % 997; return h/997*Math.PI*2; };

      function resize(size) {
        SIZE = size;
        canvas.width = SIZE*dpr; canvas.height = SIZE*dpr;
        if (canvas.style) { canvas.style.width = SIZE+'px'; canvas.style.height = SIZE+'px'; }
      }

      function ensureLayer(position) {
        if (!canvas) {
          canvas = document.createElement('canvas'); canvas.className = 'aura-layer';
          resize(SIZE);
          ctx = canvas.getContext ? canvas.getContext('2d') : null;
          off = document.createElement('canvas'); offCtx = off.getContext ? off.getContext('2d') : null;
          layer = overlay(position, canvas, 1);
          // 캔버스가 지도 터치를 가로채지 않게 합니다.
          if (canvas.parentNode && canvas.parentNode.style) canvas.parentNode.style.pointerEvents = 'none';
        } else {
          layer.setMap(map); layer.setPosition(point(position));
        }
      }

      function burst(kind, a, b) {
        const [lat,lng] = middle(a,b);
        effects.push({kind, lat, lng, born: null, ca: a.rgb, cb: b.rgb});
      }

      // 앱이 보낸 최신 상태를 반영하고, 합류·분리가 일어난 연결에 연출을 붙입니다.
      function set(data) {
        const next = data.aura && data.position && data.aura.nodes.length ? data.aura : null;
        if (!next) {
          for (const link of links.values()) {
            if (link.merged && where(link.a) && where(link.b)) split(link);
          }
          self = null; nodes.clear(); links.clear();
          if (!ghosts.length && !effects.length) stop(); else start();
          return;
        }
        self = {lat: data.position[0], lng: data.position[1], rgb: M.rgb(next.self.color), crew: next.self.crew, sync: true, phase: 0};
        limits = next.limits || M.LIMITS;
        const seen = new Set();
        for (const item of next.nodes) {
          seen.add(item.id);
          let node = nodes.get(item.id);
          if (!node) { node = {lat: item.point[0], lng: item.point[1], phase: phase(item.id)}; nodes.set(item.id, node); }
          node.toLat = item.point[0]; node.toLng = item.point[1];
          node.rgb = M.rgb(item.color); node.crew = item.crew; node.sync = item.sync;
        }
        const kept = new Set();
        for (const item of next.links) {
          const id = key(item.a, item.b); kept.add(id);
          let link = links.get(id);
          if (!link) { link = {a: item.a, b: item.b, merged: false, fusion: 0}; links.set(id, link); }
          const a = where(item.a), b = where(item.b);
          if (a && b && item.merged && !link.merged) burst('join', a, b);
          if (a && b && !item.merged && link.merged) split(link);
          link.merged = item.merged; link.m = item.m;
        }
        for (const [id, link] of links) {
          if (kept.has(id)) continue;
          if (link.merged && where(link.a) && where(link.b)) split(link);
          links.delete(id);
        }
        for (const id of [...nodes.keys()]) if (!seen.has(id)) nodes.delete(id);
        // 캔버스는 나와 친구들의 가운데에 둡니다.
        const all = [self, ...[...nodes.values()].map(n => ({lat: n.toLat, lng: n.toLng}))];
        const lat = all.reduce((sum, n) => sum+n.lat, 0)/all.length;
        const lng = all.reduce((sum, n) => sum+n.lng, 0)/all.length;
        ensureLayer([lat, lng]);
        start();
      }

      // 떨어질 때는 이어져 있던 목이 양쪽으로 끊겨 들어가고 작은 입자가 흩어집니다.
      function split(link) {
        const a = where(link.a), b = where(link.b);
        ghosts.push({a: {lat:a.lat, lng:a.lng, rgb:a.rgb}, b: {lat:b.lat, lng:b.lng, rgb:b.rgb}, fusion: Math.max(link.fusion, .6)});
        burst('split', a, b);
        link.fusion = 0;
      }

      function start() {
        if (running) return;
        running = true;
        if (raf) raf(frame);
      }
      function stop() {
        running = false; ghosts = []; effects = [];
        if (layer) layer.setMap(null);
      }

      function frame(now) {
        if (!running) return;
        const dt = Math.min(.1, last ? (now-last)/1000 : 0);
        // 초당 30장 정도로만 그려 배터리를 아낍니다.
        if (raf && last && now-last < 30) { raf(frame); return; }
        last = now;
        // 친구 아이콘과 오라가 끊기지 않고 미끄러지듯 따라오게 합니다.
        const glide = 1-Math.exp(-dt/.9);
        for (const [id, node] of nodes) {
          node.lat += (node.toLat-node.lat)*glide; node.lng += (node.toLng-node.lng)*glide;
          const entry = runners.get(id);
          if (entry) entry.overlay.setPosition(new kakao.maps.LatLng(node.lat, node.lng));
        }
        for (const link of links.values()) {
          const target = link.merged ? 1 : 0;
          link.fusion += Math.sign(target-link.fusion)*Math.min(Math.abs(target-link.fusion), dt/.6);
        }
        for (const effect of effects) if (effect.born == null) effect.born = now;
        for (const ghost of ghosts) ghost.fusion -= dt/.7;
        ghosts = ghosts.filter(ghost => ghost.fusion > 0);
        effects = effects.filter(effect => now-effect.born < (effect.kind === 'join' ? 1100 : 800));
        if (!self && !ghosts.length && !effects.length) { stop(); return; }
        draw(now);
        if (raf) raf(frame);
      }

      function draw(now) {
        const projection = map.getProjection && map.getProjection();
        const anchor = layer && layer.getPosition ? layer.getPosition() : null;
        if (!ctx || !projection || !anchor) return;
        const origin = projection.containerPointFromCoords(anchor);
        // 배율은 오라 크기에만 반영합니다. 확대할수록 조금 크게 그립니다.
        const zoom = Math.max(.7, Math.min(1.5, 1.6-map.getLevel()*.15));
        // 이어진 친구가 멀어도 캔버스 안에 들어오게 크기를 맞춥니다(너무 커지지 않게 상한을 둡니다).
        let reach = 0;
        for (const n of [self, ...nodes.values(), ...ghosts.flatMap(g => [g.a, g.b]), ...effects]) {
          if (!n) continue;
          const q = projection.containerPointFromCoords(new kakao.maps.LatLng(n.lat, n.lng));
          reach = Math.max(reach, Math.abs(q.x-origin.x), Math.abs(q.y-origin.y));
        }
        const needed = Math.min(1800, Math.max(560, Math.ceil((reach+BASE*zoom*2.2+20)*2/40)*40));
        if (needed > SIZE || needed < SIZE*.6) resize(needed);
        const at = p => { const q = projection.containerPointFromCoords(new kakao.maps.LatLng(p.lat, p.lng)); return [q.x-origin.x+SIZE/2, q.y-origin.y+SIZE/2]; };
        const seconds = now/1000;
        // 페이스가 비슷하면 같은 박자로, 다르면 어긋난 박자로 맥동합니다.
        const pulse = n => still ? 1 : 1+.07*Math.sin(n.sync ? seconds*Math.PI*2/1.6 : seconds*Math.PI*2/1.15+n.phase);
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.clearRect(0,0,SIZE,SIZE);
        if (self) {
          const all = [['self', self], ...nodes];
          const groups = new Map();
          for (const [id, n] of all) {
            const g = n.crew == null ? 'solo:'+id : 'crew:'+n.crew;
            if (!groups.has(g)) groups.set(g, []);
            groups.get(g).push([id, n]);
          }
          for (const members of groups.values()) {
            const count = members.length;
            // 인원이 늘수록 합쳐진 오라가 커집니다.
            const grow = 1+.16*(Math.min(count,6)-1);
            const shapes = [], ids = new Set(members.map(m => m[0]));
            for (const [, n] of members) { const [x,y] = at(n); shapes.push({x, y, r: BASE*zoom*grow*pulse(n), c: n.rgb}); }
            for (const link of links.values()) {
              if (!link.fusion || !ids.has(link.a) || !ids.has(link.b)) continue;
              const a = where(link.a), b = where(link.b), [ax,ay] = at(a), [bx,by] = at(b);
              shapes.push({link: true, ax, ay, bx, by, r: BASE*zoom*grow*.62*M.neck(link.m, limits)*link.fusion, w: .9*link.fusion, ca: a.rgb, cb: b.rgb});
            }
            blob(shapes, count >= 2, count >= 3 ? members.map(m => m[1].rgb) : null, seconds);
          }
          // 100m 안의 아직 합쳐지지 않은 친구와는 빛줄기로 잇습니다. 가까울수록 굵어집니다.
          for (const link of links.values()) {
            const strength = M.beam(link.m, limits)*(1-link.fusion);
            const a = where(link.a), b = where(link.b);
            if (strength <= 0 || !a || !b) continue;
            const [ax,ay] = at(a), [bx,by] = at(b);
            const paint = ctx.createLinearGradient(ax,ay,bx,by);
            paint.addColorStop(0, 'rgb('+a.rgb+')'); paint.addColorStop(1, 'rgb('+b.rgb+')');
            ctx.save();
            ctx.globalAlpha = .3+.55*strength; ctx.strokeStyle = paint; ctx.lineCap = 'round';
            ctx.lineWidth = (1.5+6.5*strength)*zoom;
            ctx.shadowColor = 'rgb('+a.rgb.map((v,i) => Math.round((v+b.rgb[i])/2))+')'; ctx.shadowBlur = 8;
            ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
            ctx.restore();
          }
        }
        for (const ghost of ghosts) {
          const [ax,ay] = at(ghost.a), [bx,by] = at(ghost.b), f = ghost.fusion, r = BASE*zoom*.5*f;
          if (r < 2) continue;
          blob([
            {link: true, ax, ay, bx: ax+(bx-ax)*.5*f, by: ay+(by-ay)*.5*f, r, w: .9, ca: ghost.a.rgb, cb: ghost.a.rgb},
            {link: true, ax: bx, ay: by, bx: bx+(ax-bx)*.5*f, by: by+(ay-by)*.5*f, r, w: .9, ca: ghost.b.rgb, cb: ghost.b.rgb},
          ], false, null, seconds);
        }
        for (const effect of effects) {
          const [x,y] = at(effect), age = now-effect.born;
          const mid = 'rgb('+effect.ca.map((v,i) => Math.round((v+effect.cb[i])/2))+')';
          ctx.save();
          if (effect.kind === 'join') {
            // "합류!" 링이 한 번 퍼져 나갑니다.
            const u = Math.min(1, age/900), ease = 1-(1-u)*(1-u);
            ctx.globalAlpha = 1-u; ctx.strokeStyle = mid; ctx.lineWidth = 1+4*(1-u);
            ctx.beginPath(); ctx.arc(x, y, (16+74*ease)*zoom, 0, Math.PI*2); ctx.stroke();
            const v = Math.min(1, age/1100);
            ctx.globalAlpha = v < .6 ? 1 : 1-(v-.6)/.4;
            ctx.font = '900 18px sans-serif'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
            ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(15,23,42,.85)'; ctx.fillStyle = '#fff';
            ctx.strokeText('합류!', x, y-34*zoom-14*v); ctx.fillText('합류!', x, y-34*zoom-14*v);
          } else if (!still) {
            const u = Math.min(1, age/800);
            for (let i = 0; i < 12; i++) {
              const angle = i/12*Math.PI*2+effect.lat*1e5%1, speed = 26+18*((i*7)%5)/4;
              ctx.globalAlpha = 1-u;
              ctx.fillStyle = 'rgb('+(i%2 ? effect.ca : effect.cb)+')';
              ctx.beginPath(); ctx.arc(x+Math.cos(angle)*speed*u*zoom, y+Math.sin(angle)*speed*u*zoom+10*u*u, 2.6*(1-u)+.6, 0, Math.PI*2); ctx.fill();
            }
          }
          ctx.restore();
        }
      }

      // 세기장을 낮은 해상도로 계산한 뒤 부드럽게 늘려 그립니다.
      function blob(shapes, rim, palette, seconds) {
        if (!offCtx || !shapes.length) return;
        let x0 = SIZE, y0 = SIZE, x1 = 0, y1 = 0, cx = 0, cy = 0, count = 0;
        for (const s of shapes) {
          const xs = s.link ? [s.ax, s.bx] : [s.x], ys = s.link ? [s.ay, s.by] : [s.y];
          x0 = Math.min(x0, ...xs.map(v => v-s.r)); x1 = Math.max(x1, ...xs.map(v => v+s.r));
          y0 = Math.min(y0, ...ys.map(v => v-s.r)); y1 = Math.max(y1, ...ys.map(v => v+s.r));
          if (!s.link) { cx += s.x; cy += s.y; count++; }
        }
        x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
        x1 = Math.min(SIZE, Math.ceil(x1)); y1 = Math.min(SIZE, Math.ceil(y1));
        if (x1 <= x0 || y1 <= y0) return;
        if (count) { cx /= count; cy /= count; }
        let cell = 3;
        while ((x1-x0)*(y1-y0)/(cell*cell) > 16000) cell++;
        const w = Math.ceil((x1-x0)/cell), h = Math.ceil((y1-y0)/cell);
        off.width = w; off.height = h;
        const image = offCtx.createImageData(w, h), px = image.data;
        const turn = still ? 0 : seconds*.35;
        for (let j = 0; j < h; j++) {
          const y = y0+(j+.5)*cell;
          for (let i = 0; i < w; i++) {
            const x = x0+(i+.5)*cell;
            M.sample(shapes, x, y, out);
            const f = out[0];
            if (!f) continue;
            let r = out[1], g = out[2], b = out[3], alpha = .62*M.smooth(f/.55);
            if (rim && f > .14 && f < .34) {
              // 합쳐진 오라의 테두리입니다. 세 명부터는 멤버들의 색이 링을 따라 돕니다.
              const band = 1-Math.abs((f-.24)/.1);
              if (palette) {
                const spot = ((Math.atan2(y-cy, x-cx)/(Math.PI*2)+turn)%1+1)%1;
                const c = palette[Math.floor(spot*palette.length*2)%palette.length];
                r += (c[0]-r)*band; g += (c[1]-g)*band; b += (c[2]-b)*band;
              } else {
                r += (255-r)*.3*band; g += (255-g)*.3*band; b += (255-b)*.3*band;
              }
              alpha = Math.max(alpha, .9*band);
            }
            const o = (j*w+i)*4;
            px[o] = r; px[o+1] = g; px[o+2] = b; px[o+3] = alpha*255;
          }
        }
        offCtx.putImageData(image, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(off, 0, 0, w, h, x0, y0, w*cell, h*cell);
      }

      return {
        set,
        frame,
        // 캔버스가 오라를 대신 그리는 러너입니다. 개별 오라 표시는 꺼 둡니다.
        fused: id => !!self && (id === 'self' || nodes.has(id)),
        effects: () => effects.map(effect => effect.kind),
      };
    })();
    const gesture = () => emit({type:'gesture'});
    kakao.maps.event.addListener(map,'dragstart',gesture);
    container.addEventListener('touchstart',e => {if(e.touches.length>1) gesture();},{passive:true});
    container.addEventListener('wheel',gesture,{passive:true});
    container.addEventListener('dblclick',gesture);
    kakao.maps.event.addListener(map,'click',() => emit({type:'tap'}));
    kakao.maps.event.addListener(map,'idle',() => {
      const center = map.getCenter();
      emit({type:'camera',latitude:center.getLat(),longitude:center.getLng(),zoom:20-map.getLevel()});
    });
    const observer = new ResizeObserver(() => {const center=map.getCenter(); map.relayout(); map.setCenter(center);});
    observer.observe(container);
    window.runspotMap = {auraFrame: now => aura.frame(now), auraEffects: () => aura.effects(), update(data) {
      aura.set(data);
      if (data.position) {
        if (!own) {ownElement=document.createElement('div'); ownElement.className='point'; ownElement.setAttribute('aria-label','내 현재 위치'); own=overlay(data.position,ownElement,5);}
        else own.setPosition(point(data.position));
        // 착용한 테두리를 사용자가 고른 색으로 내 위치 원에 표시합니다.
        const frame=data.frame&&/^#[0-9A-F]{6}$/i.test(data.frame.color)?data.frame:null;
        const ownClass=(frame?'point frame '+(frame.style==='aura'?'aura':'basic'):'point')+(frame&&aura.fused('self')?' fused':'');
        if(ownElement.className!==ownClass){ownElement.className=ownClass; ownElement.innerHTML=frame?runnerIcon:'';}
        ownElement.style.setProperty('--c',frame?frame.color:'');
        ownElement.style.setProperty('--g',frame?frame.color+'99':'');
      } else if (own) {own.setMap(null); own=null; ownElement=null;}
      const ids = new Set(data.markers.map(m=>m.id));
      for (const [id,entry] of runners) {if(!ids.has(id)){entry.overlay.setMap(null);runners.delete(id);}}
      for (const marker of data.markers) {
        let entry=runners.get(marker.id);
        if(!entry){
          const element=document.createElement('button'); element.type='button';
          element.addEventListener('click',e=>{e.stopPropagation();emit({type:'marker',id:marker.id});});
          entry={element,overlay:overlay(marker.point,element,6)}; runners.set(marker.id,entry);
        }
        // 다른 러너가 착용한 테두리를 그 러너가 고른 색으로 보여줍니다.
        const worn=marker.frame&&/^#[0-9A-F]{6}$/i.test(marker.frame.color)?marker.frame:null;
        entry.element.className='runner'+(marker.memberCount>1?' group':'')+(marker.selected?' selected':'')
          +(worn?' framed'+(worn.style==='aura'?' aura':''):'')+(aura.fused(marker.id)?' fused':'');
        entry.element.style.setProperty('--c',worn?worn.color:'');
        entry.element.style.setProperty('--g',worn?worn.color+'99':'');
        entry.element.textContent=marker.memberCount>1?String(marker.memberCount):marker.nickname.slice(0,2);
        // 인원이 많을수록 동그라미를 조금씩 키웁니다.
        const size=marker.memberCount>1?Math.min(78,46+4*marker.memberCount)+'px':'';
        entry.element.style.setProperty('width',size);entry.element.style.setProperty('height',size);
        entry.element.title=marker.nickname;
        entry.element.setAttribute('aria-label',marker.nickname);
        // 오라가 이어진 친구는 그리기 루프가 위치를 부드럽게 옮깁니다.
        if(!aura.fused(marker.id)||!entry.glided){entry.overlay.setPosition(point(marker.point));}
        entry.glided=aura.fused(marker.id);
      }
      const nextGeometry=JSON.stringify([data.segments,data.endpoints]);
      if(nextGeometry!==geometry){
        geometry=nextGeometry;
        for(const line of lines) line.setMap(null);
        for(const end of ends) end.setMap(null);
        lines=[];ends=[];
        for(const segment of data.segments){if(segment.length<2)continue;
          const path=segment.map(point);
          for(const [strokeColor,strokeWeight] of [['#ffffff',8],['#16836f',5]])
            lines.push(new kakao.maps.Polyline({map,path,strokeColor,strokeWeight,strokeOpacity:1}));
        }
        const points=data.segments.flat();
        if(data.endpoints&&points.length){
          const first=points[0],last=points[points.length-1];
          const marker=(xy,text,end)=>{const element=document.createElement('div');element.className=end?'endpoint end':'endpoint';element.setAttribute('aria-label',text);element.title=text;
            element.innerHTML=end
              ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3h10l1 3h5v11h-8l-1-3H7v7H5V3zm2 2v7h6l1 3h5V8h-4l-1-3H7z"/></svg>'
              : '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="4"/></svg>';
            ends.push(overlay(xy,element,7));};
          marker(first,'출발',false);
          if(first[0]!==last[0]||first[1]!==last[1])marker(last,'도착',true);
        }
      }
      const camera=data.camera;
      if(camera.revision!==revision){
        revision=camera.revision;
        if(camera.type==='fit'&&camera.points.length){
          const bounds=new kakao.maps.LatLngBounds(); camera.points.forEach(p=>bounds.extend(point(p)));
          map.setBounds(bounds,camera.padding,camera.padding,camera.padding,camera.padding);
          if(map.getLevel()<level(camera.maxZoom))map.setLevel(level(camera.maxZoom));
        }else if(camera.type==='move'){
          const target=point(camera.center),targetLevel=level(camera.zoom);
          if(camera.animate===true){
            map.jump(target,targetLevel,{animate:{duration:700}});
          }else{
            if(map.getLevel()!==targetLevel)map.setLevel(targetLevel);
            const center=map.getCenter();
            if(center.getLat()!==target.getLat()||center.getLng()!==target.getLng())map.setCenter(target);
          }
        }
      }
    }};
    emit({type:'ready'});
  });
};
</script>
<script src="__KAKAO_SDK_URL__" onload="createRunspotMap()" onerror="mapLoadFailed()"></script>
</body></html>
